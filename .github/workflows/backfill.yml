name: traer historial de ligas nuevas

# Se corre a mano, una vez: trae de ESPN el historial de las ligas domésticas de los clubes que
# juegan copas UEFA (scripts/backfill_espn.py), lo guarda en el estado de Supabase y lo deja como
# artefacto descargable para ajustar los modelos de esas ligas.

on:
  workflow_dispatch:
    inputs:
      ligas:
        description: "Códigos de ESPN separados por espacios (vacío = la lista del script)"
        type: string
        default: ""
      desde:
        description: "Primer año"
        type: string
        default: "2010"

permissions:
  contents: read

concurrency:
  group: actualizar-datos   # no se cruza con la actualización cada 2 horas
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: traer historial
        run: python scripts/backfill_espn.py --remote --desde ${{ inputs.desde }} ${{ inputs.ligas }}
      - uses: actions/upload-artifact@v4
        with:
          name: almacen
          path: |
            data/processed/matches.parquet
            data/processed/teams.parquet
            data/processed/stats.parquet
            data/processed/backfill_resumen.json
          retention-days: 14
